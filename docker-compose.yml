# Backend + LiveKit (audio calls) + Egress (call recording) + Redis.
# The frontend runs with `npm run dev` (see README).
services:
  redis:
    user: root
    image: redis:7-alpine

  livekit:
    user: root
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"        # signalling (WebSocket) + HTTP API
      - "7881:7881"        # WebRTC over TCP (fallback)
      - "7882:7882/udp"    # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  egress:
    user: root
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 8080
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./data/recordings:/out      # recordings land here ...
    depends_on: [livekit, redis]

  backend:
    user: root
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LIVEKIT_URL: ws://localhost:7880          # what the browser connects to
      LIVEKIT_API_URL: http://livekit:7880      # what the backend calls
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      DRAFTER: ${DRAFTER:-placeholder}
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data/recordings:/data/recordings      # ... and are read here
      - qadam-db:/data
      - whisper-cache:/root/.cache/huggingface  # Whisper weights are downloaded once
    depends_on: [livekit]

volumes:
  qadam-db:
  whisper-cache:
